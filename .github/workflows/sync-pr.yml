name: Create Sync PR Based on Label

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set Target Branch Based on Label
        id: set-target
        run: |
          if [ "${{ github.event.label.name }}" = "dev" ]; then
            echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
          elif [ "${{ github.event.label.name }}" = "stage" ]; then
            echo "TARGET_BRANCH=stage" >> $GITHUB_ENV
          else
            echo "No matching label found, skipping."
            exit 0
          fi

      - name: Create Sync Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.TARGET_BRANCH }}
          head: ${{ github.event.pull_request.head.ref }}
          title: "Sync PR from ${{ github.event.pull_request.head.ref }} → ${{ env.TARGET_BRANCH }}"
          body: "Automatically created sync PR from ${{ github.event.pull_request.head.ref }} to ${{ env.TARGET_BRANCH }} based on label."
