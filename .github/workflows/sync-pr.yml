name: Create Sync PR Based on Label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect Target Branch
        id: detect
        run: |
          if [ "${{ github.event.label.name }}" = "dev" ]; then
            echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
          elif [ "${{ github.event.label.name }}" = "stage" ]; then
            echo "TARGET_BRANCH=stage" >> $GITHUB_ENV
          else
            echo "No matching label, skipping."
            exit 0
          fi

      # 🔥 Force a change so PR is ALWAYS created
      - name: Force Dummy Change
        run: |
          echo "sync triggered at $(date)" > .sync-temp.txt

      - name: Create Sync Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "sync: ${{ github.event.pull_request.head.ref }} → ${{ env.TARGET_BRANCH }}"
          body: |
            Automatically created sync PR  
            **From:** ${{ github.event.pull_request.head.ref }}  
            **To:** ${{ env.TARGET_BRANCH }}  
          base: ${{ env.TARGET_BRANCH }}
          head: ${{ github.event.pull_request.head.ref }}
          branch: sync/${{ github.event.pull_request.head.ref }}-to-${{ env.TARGET_BRANCH }}
          delete-branch: true
