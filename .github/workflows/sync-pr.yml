name: Create Sync PR Based on Label

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # --------------------------
      # Detect Target Branch
      # --------------------------
      - name: Detect Target Branch
        id: detect
        run: |
          echo "Label name is: ${{ github.event.label.name }}"

          if [ "${{ github.event.label.name }}" = "Merge to Development" ]; then
            echo "TARGET_BRANCH=development" >> $GITHUB_ENV
          elif [ "${{ github.event.label.name }}" = "Merge to Staging" ]; then
            echo "TARGET_BRANCH=staging" >> $GITHUB_ENV
          else
            echo "No matching label, skipping."
            exit 0
          fi

      # --------------------------
      # Create Sync Pull Request
      # --------------------------
      - name: Create Sync Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "sync: ${{ github.event.pull_request.head.ref }} → ${{ env.TARGET_BRANCH }}"
          body: |
            Automatically created sync PR  
            **From:** ${{ github.event.pull_request.head.ref }}  
            **To:** ${{ env.TARGET_BRANCH }}  
            Triggered by label: **${{ github.event.label.name }}**
          base: ${{ env.TARGET_BRANCH }}
          head: ${{ github.event.pull_request.head.ref }}
          branch: "sync/${{ github.event.pull_request.head.ref }}-to-${{ env.TARGET_BRANCH }}"
          delete-branch: true
