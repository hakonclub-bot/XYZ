name: Create Sync PR Based on Label

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check label and set target branch
        id: set_target
        run: |
          if [ "${{ github.event.label.name }}" = "dev" ]; then
            echo "target=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.label.name }}" = "stage" ]; then
            echo "target=stage" >> $GITHUB_OUTPUT
          else
            echo "No valid label found. Exiting."
            exit 0
          fi

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release  # your default branch

      - name: Create sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="sync-release-to-${{ steps.set_target.outputs.target }}-${{ github.run_id }}"
          git checkout -b $BRANCH

      - name: Merge release → target
        run: |
          git fetch origin ${{ steps.set_target.outputs.target }}
          git merge origin/${{ steps.set_target.outputs.target }} --no-edit || true
          git push origin HEAD

      - name: Create Sync Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.ref_name }}
          base: ${{ steps.set_target.outputs.target }}
          title: "Sync: release → ${{ steps.set_target.outputs.target }}"
          body: "Automated sync PR triggered when '${{ github.event.label.name }}' label was added."
